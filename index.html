<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>MathBlitz • Event Control</title>
<style>
:root{
 --ink:#171717;--paper:#f5efe0;--pink:#ed3b7a;--teal:#28bca8;--yellow:#f5c542;
 --purple:#887bd3;--blue:#4d8ee8;--white:#fff;--muted:#6b665c;--line:#d7cfbe;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
body{background-image:radial-gradient(#17171718 1px,transparent 1px);background-size:20px 20px}
button,input,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{min-height:100vh;padding:18px}
.shell{max-width:1220px;margin:0 auto}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:12px}
.logo{font-size:clamp(30px,6vw,54px);font-weight:1000;font-style:italic;line-height:.85;text-shadow:4px 4px 0 var(--yellow)}
.tag{font-size:10px;font-weight:900;letter-spacing:1.7px;margin-top:7px}
.pagebadge{border:3px solid var(--ink);border-radius:999px;background:var(--white);padding:8px 12px;font-weight:1000;white-space:nowrap}
.nav{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
.nav a{text-decoration:none;text-align:center;border:3px solid var(--ink);border-radius:12px;background:#fff;padding:11px 8px;font-size:12px;font-weight:1000;box-shadow:3px 3px 0 var(--ink)}
.nav a.active{background:var(--pink);color:#fff}
.nav a:nth-child(2).active{background:var(--teal);color:var(--ink)}
.nav a:nth-child(3).active{background:var(--yellow);color:var(--ink)}
.nav a:nth-child(4).active{background:var(--purple);color:#fff}
.nav a:nth-child(5).active{background:var(--blue);color:#fff}
.nav a:nth-child(6).active{background:var(--ink);color:#fff}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:18px;box-shadow:6px 6px 0 var(--ink)}
.card + .card{margin-top:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:18px}
.kicker{font-size:11px;font-weight:1000;letter-spacing:2px;color:var(--muted)}
.title{font-size:clamp(28px,5vw,48px);font-weight:1000;line-height:1;margin:7px 0 16px}
.bigquestion{min-height:260px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(30px,5vw,64px);font-weight:1000;line-height:1.12;padding:20px}
.callmeta{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:7px 11px;font-weight:1000;background:#e4faf5}
.btn{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:12px 15px;font-weight:1000;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--pink);color:#fff}
.btn.green{background:var(--teal)}
.btn.yellow{background:var(--yellow)}
.btn.purple{background:var(--purple);color:#fff}
.btn.dark{background:var(--ink);color:#fff}
.full{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{border:3px solid var(--ink);border-radius:14px;padding:13px;background:#fff}
.stat b{display:block;font-size:28px}
.note{font-size:12px;line-height:1.5;color:#5d584f;font-weight:700}
input[type=text],input[type=number]{width:100%;border:3px solid var(--ink);border-radius:12px;padding:13px;background:#fff;font-weight:900;outline:none}
input:focus{box-shadow:0 0 0 4px #28bca833}
.status{border:3px solid var(--ink);border-radius:12px;padding:14px;margin-top:10px;font-weight:1000}
.ok{background:#c9f6ec}.bad{background:#ffd8e2}.warn{background:#ffeab5}
.tablewrap{overflow:auto;max-height:55vh;border:2px solid var(--ink);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px;border-bottom:1px solid #ccc;text-align:left}
th{background:var(--ink);color:#fff;position:sticky;top:0}
.projector{min-height:100vh;display:flex;flex-direction:column}
.projector .screen{flex:1;min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.projector .bigquestion{min-height:auto;font-size:clamp(38px,6.5vw,96px);padding:25px}
.projector .counter{font-size:18px;font-weight:1000;text-align:center;padding:12px}
.scannerbox{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
video{width:100%;max-height:420px;background:#111;border:3px solid var(--ink);border-radius:15px;object-fit:cover}
.sheetgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}
.sheetcell{aspect-ratio:1;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:1000;background:#fff;border-radius:5px}
.sheetcell.free{background:var(--ink);color:var(--yellow)}
.sheetcell.marked{background:var(--teal)}
.footer{margin-top:18px;text-align:center;font-size:11px;font-weight:800;color:var(--muted)}
.catpill{display:inline-block;font-size:9px;font-weight:1000;padding:2px 7px;border-radius:999px;background:var(--pink);color:#fff}
@media(max-width:900px){.grid2,.scannerbox{grid-template-columns:1fr}.nav{grid-template-columns:repeat(3,1fr)}.statgrid{grid-template-columns:1fr 1fr}}
@media(max-width:540px){.app{padding:10px}.card{padding:14px}.topbar{align-items:flex-start}.pagebadge{font-size:11px}.statgrid{grid-template-columns:1fr}.bigquestion{min-height:200px}}
</style>
</head>

const STORE = "MATHBLITZ_STATE_FINAL";

function blank(){ return {history:[], started:false}; }
function load(){
  try{
    const x = JSON.parse(localStorage.getItem(STORE));
    if (x && Array.isArray(x.history)) return x;
  }catch(e){}
  return blank();
}
let state = load();
function emit(){
  try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){}
  try{
    if ("BroadcastChannel" in window){
      window.__mbbc = window.__mbbc || new BroadcastChannel(STORE);
      window.__mbbc.postMessage(state);
    }
  }catch(e){}
  render();
}
window.addEventListener("storage", e=>{
  if (e.key===STORE && e.newValue){ try{ state = JSON.parse(e.newValue); render(); }catch(x){} }
});
try{
  if ("BroadcastChannel" in window){
    window.__mbbc = new BroadcastChannel(STORE);
    window.__mbbc.onmessage = e=>{ if (e.data){ state = e.data; render(); } };
  }
}catch(e){}

function esc(v){ return String(v).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function route(){ return location.hash.replace("#","").split("?")[0].toLowerCase() || "home"; }
function openPage(name){ const base = window.location.href.split("#")[0]; window.open(base+"#"+name, "_blank", "noopener,noreferrer"); }

function nav(){
  const r = route();
  const links = [["home","CONTROL"],["display","PROJECTOR"],["key","AUDITOR"],["scan","SCANNER"],["sheets","PRINT PACK"],["ledger","LEDGER"]];
  return `<nav class="nav">${links.map(([h,t])=>`<a class="${r===h?"active":""}" href="#${h}" onclick="openPage('${h}');return false;">${t}</a>`).join("")}</nav>`;
}
function header(name){
  return `<header class="topbar"><div class="brand"><div><div class="logo">MATHBLITZ</div><div class="tag">MATHZILLA 2026 • MATHS CLUB EVENT CONTROL</div></div></div><div class="pagebadge">${esc(name)}</div></header>`;
}
function catBadge(cat){
  const c = CAT_COLORS[cat] || "#ed3b7a";
  return `<span class="catpill" style="background:${c}">${esc(cat)}</span>`;
}

function nextClue(){
  const total = QUESTIONS.length;
  if (state.history.length >= total){ alert("All "+total+" clues have already been called."); return; }
  const q = QUESTIONS[state.history.length];
  state = {...state, started:true, history:[...state.history, {seq: state.history.length+1, q:q.q, cat:q.cat, a:q.a}]};
  emit();
}
function resetRound(){
  if (confirm("Reset the entire MathBlitz round? This clears the call ledger on this browser/device.")){ state = blank(); emit(); }
}

// ---------- PROJECTOR (public display, no answers) ----------
function display(){
  const n = state.history.length;
  const q = n ? state.history[n-1] : null;
  const total = QUESTIONS.length;
  return `<main class="app projector"><div class="shell" style="width:100%;max-width:1500px;min-height:100vh;display:flex;flex-direction:column">${header("PROJECTOR DISPLAY")}${nav()}
  <div class="card screen"><div class="kicker" style="font-size:16px">${q?`CLUE ${n} / ${total}`:"MATHBLITZ"}</div>
  <div class="bigquestion">${q?esc(q.q):"<span style='color:var(--pink)'>READY</span>"}</div>
  <div class="counter">${n} / ${total} CLUES CALLED</div></div></div></main>`;
}

// ---------- AUDITOR (answer verification, works on any device) ----------
function ledgerRows(limit){
  const items = limit ? state.history.slice(-limit).reverse() : state.history.slice().reverse();
  return items.map(h=>`<tr><td><b>${h.seq}</b></td><td><b>${esc(h.q)}</b></td><td>${catBadge(h.cat)}</td><td><b>${h.a}</b></td></tr>`).join("");
}
function ledgerCard(){
  return `<div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">MASTER CALLER LEDGER</h2><div class="note">Exact call order • audit record</div></div><div class="pill">${state.history.length}/${QUESTIONS.length} CALLED</div></div><div style="margin-top:12px" class="tablewrap"><table><thead><tr><th>SEQ</th><th>CLUE</th><th>CATEGORY</th><th>ANSWER</th></tr></thead><tbody>${ledgerRows()||'<tr><td colspan="4" class="empty" style="text-align:center;padding:30px">No clues called yet.</td></tr>'}</tbody></table></div></div>`;
}
function key(){
  return `<main class="app"><div class="shell">${header("AUDITOR & VERIFIER")}${nav()}
  <div class="card" style="border-color:#7a4a0c;background:#F6C44533"><span class="note">🔒 For hosts/judges only — do not show this page to participants. Works correctly on ANY device (phone, second laptop) since the call ledger below is synced from local storage on this specific browser. If you're checking from a separate device that hasn't been drawing clues itself, ask the host to read out numbers, or use this only on the same device as Host Control.</span></div>
  <div class="card"><h1 style="margin-top:0">Instant Answer Verification</h1><p class="note">Enter any claimed number from 1–25. Valid only if it's already been called.</p>
  <input id="audit" type="number" min="1" max="25" inputmode="numeric" placeholder="Claimed grid number (1–25)" oninput="audit()"><div id="auditOut"></div></div>
  <div style="margin-top:18px">${ledgerCard()}</div></div></main>`;
}
function audit(){
  const x = document.getElementById("audit"), o = document.getElementById("auditOut");
  if (!x || !o) return;
  if (!x.value){ o.innerHTML=""; return; }
  const n = Number(x.value);
  if (!Number.isInteger(n) || n<1 || n>25){ o.innerHTML='<div class="status warn">INVALID — ENTER A NUMBER FROM 1 TO 25</div>'; return; }
  const found = state.history.find(h=>h.a===n);
  o.innerHTML = found ? `<div class="status ok">✓ VALID — NUMBER ${n} WAS CALLED IN CLUE ${found.seq}</div>` : `<div class="status bad">⚠ NOT YET CALLED — NUMBER ${n} HAS NOT COME UP</div>`;
}

// ---------- SCANNER (QR / Player ID lookup + tap-to-verify) ----------
let cameraStream = null, scanTimer = null;
const marks = new Set();

function scanner(){
  return `<main class="app"><div class="shell">${header("BINGO CARD SCANNER")}${nav()}
  <div class="scannerbox">
   <section class="card"><h1 style="margin-top:0">Scan Participant's Card</h1>
    <div class="status warn"><b>NOTE:</b> Camera scanning needs HTTPS (works on GitHub Pages) and camera permission. If it fails, use the Card ID box on the right — it works everywhere.</div>
    <video id="cam" autoplay playsinline muted></video>
    <div class="row" style="margin-top:10px"><button class="btn green" onclick="startCamera()">START CAMERA</button><button class="btn" onclick="stopCamera()">STOP</button></div>
    <div id="scanMsg"></div>
   </section>
   <aside class="card"><h2 style="margin-top:0">Manual lookup (always works)</h2>
    <p class="note">Type the Card ID printed on the sheet (e.g. MB-023 or just 023).</p>
    <label class="kicker">CARD ID</label><input id="playerId" type="text" placeholder="MB-023" autocomplete="off" style="margin-top:6px">
    <button class="btn primary full" style="margin-top:10px" onclick="loadPlayer()">LOAD CARD</button>
    <div id="sheetResult"></div>
   </aside>
  </div></div></main>`;
}

let jsqrPromise = null;
function loadJsQR(){
  if (window.jsQR) return Promise.resolve(window.jsQR);
  if (jsqrPromise) return jsqrPromise;
  jsqrPromise = new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js";
    s.onload = ()=>resolve(window.jsQR);
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return jsqrPromise;
}
async function startCamera(){
  const msg = document.getElementById("scanMsg");
  if (location.protocol!=="https:" && location.hostname!=="localhost"){
    msg.innerHTML = '<div class="status bad">CAMERA REQUIRES HTTPS. Open the GitHub Pages version, or use Card ID lookup instead.</div>';
    return;
  }
  if (!navigator.mediaDevices?.getUserMedia){
    msg.innerHTML = '<div class="status bad">CAMERA API UNAVAILABLE. Use Card ID lookup.</div>';
    return;
  }
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}, width:{ideal:1280}, height:{ideal:720}}});
    const v = document.getElementById("cam");
    v.srcObject = cameraStream; await v.play();
    msg.innerHTML = '<div class="status ok">CAMERA ACTIVE — POINT AT THE QR CODE</div>';
    const detector = ("BarcodeDetector" in window) ? new BarcodeDetector({formats:["qr_code"]}) : null;
    const c = document.createElement("canvas"), ctx = c.getContext("2d");
    const loop = async ()=>{
      if (!cameraStream) return;
      if (v.readyState>=2){
        c.width=v.videoWidth; c.height=v.videoHeight; ctx.drawImage(v,0,0,c.width,c.height);
        try{
          if (detector){
            const hits = await detector.detect(c);
            if (hits.length){ useQR(hits[0].rawValue); stopCamera(); return; }
          } else {
            const lib = await loadJsQR();
            const img = ctx.getImageData(0,0,c.width,c.height);
            const hit = lib(img.data, img.width, img.height, {inversionAttempts:"attemptBoth"});
            if (hit){ useQR(hit.data); stopCamera(); return; }
          }
        }catch(e){}
      }
      scanTimer = requestAnimationFrame(loop);
    };
    loop();
  }catch(e){
    msg.innerHTML = '<div class="status bad">CAMERA FAILED. Check browser permission, or use Card ID lookup.</div>';
  }
}
function stopCamera(){
  if (scanTimer) cancelAnimationFrame(scanTimer);
  scanTimer = null;
  if (cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
}
function useQR(raw){
  const parts = String(raw).split(":");
  if (parts.length<2 || parts[0]!=="MATHBLITZ"){ showScan('<div class="status bad">UNRECOGNIZED QR CODE</div>'); return; }
  loadSheet(parts[1].trim());
}
function loadPlayer(){
  const raw = (document.getElementById("playerId")?.value || "").trim().toUpperCase();
  const id = raw.replace("MB-","").replace("MB","").padStart(3,"0");
  loadSheet(id);
}
function showScan(x){ const el = document.getElementById("sheetResult"); if (el) el.innerHTML = x; }
function loadSheet(id){
  const s = SHEETS.find(x=>x.id===id);
  if (!s){ showScan('<div class="status bad">CARD ID NOT FOUND</div>'); return; }
  marks.clear();
  showScan(`<div class="status ok"><b>MB-${esc(s.id)}</b> LOADED — tap the numbers the participant has marked<div class="sheetgrid">${s.numbers.map(n=>n==="FREE"?`<div class="sheetcell free">★</div>`:`<button class="sheetcell" data-n="${n}" onclick="toggleMark(this,${n})">${n}</button>`).join("")}</div><div id="claim"></div></div>`);
}
function toggleMark(btn, n){
  if (marks.has(n)){ marks.delete(n); btn.classList.remove("marked"); }
  else { marks.add(n); btn.classList.add("marked"); }
  const bad = [...marks].filter(n=>!state.history.some(h=>h.a===n));
  const totalNonFree = 24;
  const out = document.getElementById("claim");
  if (!out) return;
  if (!marks.size){ out.innerHTML=""; return; }
  if (bad.length){
    out.innerHTML = `<div class="status bad">✕ INVALID CLAIM — ${bad.length} marked number(s) were NOT called: ${bad.join(", ")}</div>`;
  } else if (marks.size >= totalNonFree){
    out.innerHTML = `<div class="status ok">✓ FULL CARD — ALL 24 MARKS VERIFIED. THIS IS A VALID BINGO!</div>`;
  } else {
    out.innerHTML = `<div class="status ok">✓ ${marks.size}/24 marked so far, all verified valid. Keep checking.</div>`;
  }
}

// ---------- PRINT PACK ----------
function sheets(){
  return `<main class="app"><div class="shell">${header("PRINT PACK")}${nav()}
  <div class="card"><h1 style="margin-top:0">Bingo Print Pack</h1><p class="note">100 unique 5×5 sheets • numbers 1–25 • free center space • QR + Card ID on every sheet • 8 per A4 page.</p>
  <div class="row"><a class="btn green" href="mathblitz_bingo_cards.pdf" target="_blank" rel="noopener">OPEN BINGO PDF</a><a class="btn" href="mathblitz_bingo_cards.pdf" download>DOWNLOAD BINGO PDF</a></div></div>
  <div class="card"><h2 style="margin-top:0">Look up a card online</h2><p class="note">Preview any participant's exact card without opening the PDF.</p>
  <select id="sheetPick" onchange="renderSheetPreview()" style="width:100%;border:3px solid var(--ink);border-radius:12px;padding:12px;font-weight:900;margin-top:6px">${SHEETS.map(s=>`<option value="${s.id}">MB-${s.id}</option>`).join("")}</select>
  <div id="sheetPreview" style="margin-top:14px"></div></div>
  </div></main>`;
}
function renderSheetPreview(){
  const id = document.getElementById("sheetPick").value;
  const s = SHEETS.find(x=>x.id===id);
  const el = document.getElementById("sheetPreview");
  if (!s || !el) return;
  el.innerHTML = `<div class="sheetgrid">${s.numbers.map(n=>n==="FREE"?`<div class="sheetcell free">★</div>`:`<div class="sheetcell">${n}</div>`).join("")}</div>`;
}

// ---------- LEDGER ----------
function ledger(){
  return `<main class="app"><div class="shell">${header("MASTER LEDGER")}${nav()}${ledgerCard()}<div class="footer">MathBlitz official audit record.</div></div></main>`;
}

function homeRoute(){
  const r = route();
  if (r==="display") return display();
  if (r==="key") return key();
  if (r==="scan") return scanner();
  if (r==="sheets") return sheets();
  if (r==="ledger") return ledger();
  return home();
}
function render(){
  document.getElementById("app").innerHTML = homeRoute();
  if (route()==="key") setTimeout(audit, 0);
  if (route()==="sheets") setTimeout(renderSheetPreview, 0);
}
window.addEventListener("hashchange", ()=>{ stopCamera(); render(); });
render();
</script>
